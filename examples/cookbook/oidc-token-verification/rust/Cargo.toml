# SPDX-License-Identifier: Apache-2.0
[package]
name = "oidc-token-verification"
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition = "2024"

[dependencies]
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "=3.4.2"

[dev-dependencies]
base64 = "0.22"
rsa = { version = "=0.9.10", features = ["pem"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3 # RSA key generation in tests
