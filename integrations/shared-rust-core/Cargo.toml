[package]
name = "genlib-inventory-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[lib]
crate-type = ["lib", "cdylib", "staticlib"]
[dependencies]
uniffi = "=0.32.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
serde_json = "1"
[[bin]]
name = "uniffi-bindgen"
path = "bindings/uniffi-bindgen.rs"
required-features = ["uniffi/cli"]
