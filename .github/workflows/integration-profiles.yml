name: Integration profiles

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    name: Direct MCP / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/genlib-mcp/package-lock.json
      - run: npm ci --prefix packages/genlib-mcp --ignore-scripts --no-audit --no-fund
      - run: npm run mcp:test

  node-packs:
    name: Pack / ${{ matrix.pack }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pack:
          - resumable-files
          - web-forms-editor
          - document-pipeline
          - web-data-workbench
          - web-calendar-files
          - durable-jobs
          - commerce-storefront
          - developer-codemods
          - api-contracts
          - desktop-delivery
          - authorization-collaboration
          - typed-backend-services
          - observability-harness
    defaults:
      run:
        working-directory: integrations/${{ matrix.pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/${{ matrix.pack }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Generate alternate API contract clients
        if: matrix.pack == 'api-contracts'
        run: |
          npm run generate:orval
          npm run generate:hey
          npm run generate:typespec
      - name: Exercise a disposable PostgreSQL service
        if: matrix.pack == 'observability-harness'
        run: npm run test:containers

  python:
    name: Python / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [codemods, telemetry, contracts, migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.profile == 'contracts'
        with: {node-version: "24"}
      - name: Test structural edits and real template updates
        if: matrix.profile == 'codemods'
        working-directory: integrations/developer-codemods
        run: |
          python -m pip install -r python/requirements.lock.txt
          python -m unittest discover -s python -p 'test_*.py' -v
      - name: Test real trace correlation
        if: matrix.profile == 'telemetry'
        working-directory: integrations/observability-harness
        run: |
          python -m pip install -r python/requirements.lock.txt
          python -m unittest discover -s python -p test_telemetry.py -v
      - name: Generate contract checks against a disposable HTTP fixture
        if: matrix.profile == 'contracts'
        working-directory: integrations/api-contracts
        run: |
          python -m pip install -r http/requirements.lock.txt
          npm run test:schemathesis
      - name: Validate original SQL migrations and rollback
        if: matrix.profile == 'migrations'
        run: python integrations/native-persistence/tests/test_sql_profile.py

  rust:
    name: Rust domain, FFI and Cedar policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Select the tested Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Test domain and policy behavior
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test --locked --manifest-path integrations/shared-rust-core/Cargo.toml
          cargo test --locked --manifest-path integrations/authorization-collaboration/cedar/Cargo.toml
      - name: Test portable desktop input and update validation
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: |
          rustc --edition=2021 --test integrations/desktop-delivery/tauri/src-tauri/src/boundary.rs -o "$RUNNER_TEMP/genlib-desktop-boundary-tests"
          "$RUNNER_TEMP/genlib-desktop-boundary-tests"
      - name: Generate and execute the Python foreign-function boundary
        working-directory: integrations/shared-rust-core
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: |
          python bindings/generate.py python
          python bindings/test_python.py

  go:
    name: Go generated SQL, cross-language RPC and desktop domain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.27.2"
          cache-dependency-path: |
            integrations/typed-backend-services/go/go.sum
            integrations/typed-backend-services/connect-go/go.sum
            integrations/desktop-delivery/wails/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24"}
      - name: Provision the exact sqlc generator
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Generate queries and test real SQLite transactions
        working-directory: integrations/typed-backend-services/go
        run: |
          sqlc generate
          go test ./...
      - name: Generate both RPC languages and test real cross-process calls
        working-directory: integrations/typed-backend-services
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint:proto
          npm test
          go -C connect-go mod download
          npm run test:go
          npm run test:cross-language
          go -C connect-go test -mod=readonly -race ./...
      - name: Test Wails application and signed update behavior
        working-directory: integrations/desktop-delivery/wails
        run: go test app.go app_test.go delivery.go delivery_test.go

  http-contracts:
    name: HTTP pagination, cache, upload and breaking-contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/api-contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24"}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: "1.27.2", cache: false}
      - name: Provision the checksum-pinned Hurl executable
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, shutil, tarfile, urllib.request
          pin = json.loads(pathlib.Path('http/tool-versions.json').read_text())['hurl']
          with urllib.request.urlopen(pin['linuxX64Asset'], timeout=60) as response:
              archive = response.read(64 * 1024 * 1024 + 1)
          if len(archive) > 64 * 1024 * 1024 or hashlib.sha256(archive).hexdigest() != pin['linuxX64AssetSha256']:
              raise SystemExit('Hurl archive size or SHA-256 differs from the reviewed pin')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'genlib-http-tools'
          destination.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              entries = [entry for entry in package.getmembers() if entry.isfile() and pathlib.PurePosixPath(entry.name).name == 'hurl']
              if len(entries) != 1:
                  raise SystemExit('Expected one regular Hurl executable')
              with package.extractfile(entries[0]) as source, (destination / 'hurl').open('xb') as target:
                  shutil.copyfileobj(source, target)
          (destination / 'hurl').chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(destination) + '\n')
          PY
      - name: Provision the exact oasdiff module
        run: |
          go install "github.com/oasdiff/oasdiff@$(node -p "require('./http/tool-versions.json').oasdiff.version")"
          go version -m "$(go env GOPATH)/bin/oasdiff"
      - name: Verify successful HTTP state chains and breaking-change detection
        run: |
          hurl --version
          npm run test:hurl
          npm run test:breaking

  swift:
    name: Swift persistence and snapshot fixtures
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: swift --version
      - run: swift test --package-path integrations/native-persistence/swift
      - run: swift test --package-path integrations/native-acceptance/swift

  flutter:
    name: Flutter controller and widget acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24"}
      - name: Install Flutter's documented Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl git unzip xz-utils zip libglu1-mesa
      - name: Provision the exact official Flutter stable checkout
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/genlib-flutter-sdk"
          test "$(git -C "$RUNNER_TEMP/genlib-flutter-sdk" rev-parse HEAD)" = "abaf9c523780a608bd46686fd5e53740a07077f8"
          echo "$RUNNER_TEMP/genlib-flutter-sdk/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/genlib-flutter-sdk/bin/flutter" config --no-analytics
      - name: Create a disposable native project and exercise all widget/controller tests
        run: |
          flutter --version
          node integrations/native-acceptance/flutter/create-fixture.mjs "$RUNNER_TEMP/genlib-native-fixture"
          cd "$RUNNER_TEMP/genlib-native-fixture"
          flutter pub get
          flutter test

  desktop-host-builds:
    name: Windows Tauri and Wails host compilation
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.27.2"
          cache-dependency-path: integrations/desktop-delivery/wails/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: "24"}
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix integrations/desktop-delivery
      - name: Select the Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Compile Tauri commands and platform adapters
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_BUILD_JOBS: "2"
        run: cargo check --locked --manifest-path integrations/desktop-delivery/tauri/src-tauri/Cargo.toml
      - name: Compile the Wails host and platform adapters
        run: |
          New-Item -ItemType Directory -Force integrations/desktop-delivery/wails/build/bin | Out-Null
          go -C integrations/desktop-delivery/wails build -tags desktop,production -o build/bin/genlib-inventory.exe .

  dotnet:
    name: Avalonia domain and build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with: {dotnet-version: "10.0.x"}
      - run: dotnet test integrations/desktop-delivery/avalonia-tests/GenlibInventory.Tests.csproj --configuration Release

  java-codemod:
    name: Java package migration and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: mvn --version
      - working-directory: integrations/developer-codemods
        run: python openrewrite/verify.py

  php-codemod:
    name: PHP structural migration and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Check runner prerequisites
        run: |
          php --version
          composer --version
      - working-directory: integrations/developer-codemods/php
        run: |
          composer install --no-interaction --no-scripts
          composer test
