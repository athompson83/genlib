name: Repository map
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate and verify commit-specific map
        run: |
          node tools/repo-map.mjs build
          node tools/repo-map.mjs check
          node -e "const m=require('./.genlib/repo-map.json');if(m.commit!==process.env.GITHUB_SHA)process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-map
          path: .genlib/repo-map.json
          retention-days: 7
