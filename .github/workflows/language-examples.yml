name: Cross-language examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
      - run: python -m unittest discover -s examples/languages/python -p 'test_*.py'
      - run: cd examples/languages/go && go test ./...
