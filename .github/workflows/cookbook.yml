name: Cookbook
on:
  push:
    paths: ['examples/cookbook/**', 'scripts/cookbook-test.sh', '.github/workflows/cookbook.yml']
  pull_request:
    paths: ['examples/cookbook/**', 'scripts/cookbook-test.sh', '.github/workflows/cookbook.yml']
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.language }}
    # Swift runs on macOS so Apple-only PDFKit snippets compile too.
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, python, go, rust, java, kotlin, csharp, dart, swift]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - if: matrix.language == 'typescript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - if: matrix.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.26'}
      - if: matrix.language == 'java' || matrix.language == 'kotlin'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: '21'}
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: {dotnet-version: '8.0.x'}
      - if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@v1
      - if: matrix.language == 'rust'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxmlsec1-dev libxml2-dev libclang-dev libssl-dev pkg-config
      - run: scripts/cookbook-test.sh ${{ matrix.language }}
