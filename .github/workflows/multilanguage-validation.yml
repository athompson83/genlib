name: Multi-language validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: cd examples/languages/rust && cargo test --locked
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with: {distribution: temurin, java-version: '17'}
      - run: cd examples/languages/java && out=$(mktemp -d) && javac --release 17 -Xlint:all -Werror -d "$out" *.java && for t in IdentifierValidatorTest TotpTest OidcPkceTest RecoveryCodesTest CalculatorTest FormSchemaTest SeoFilesTest StructuredDataTest UtmLinksTest CsvSafeTest MoneyTest SignedCursorsTest IcsEventsTest IdsTest RetryBackoffTest TokenBucketTest SemverTest CronNextTest WcagContrastTest GeoTest WebhookSignatureTest CheckDigitsTest SignedUrlsTest PolylineTest TileMathTest EmailAddressTest IsoDurationTest GeometryTest SafeRedirectTest IpCidrTest HttpRangeTest ContentNegotiationTest HttpConditionalTest CookiesTest UrlNormalizeTest StringSimilarityTest RRuleTest BaseEncodingsTest VCardTest HashingTest FeatureFlagsTest HumanUnitsTest LineDiffTest PasswordPolicyTest TextSanitizeTest SlugifyTest JsonPatchTest SseTest TextChunkingTest VectorMathTest CircuitBreakerTest BusinessDaysTest NaturalSortTest FileSignatureTest ColorConvertTest; do java -cp "$out" $t || exit 1; done
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: {dotnet-version: '8.0.x'}
      - run: dotnet run --project examples/languages/csharp/Genlib.Validation.Tests
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: cd examples/languages/swift && swift run GenlibSwiftChecks
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: cd examples/languages/kotlin && out=$(mktemp -d) && kotlinc *.kt -include-runtime -d "$out/kotlin-tests.jar" && for t in IdentifierValidatorTestKt TotpTestKt OidcPkceTestKt RecoveryCodesTestKt CalculatorTestKt FormSchemaTestKt SeoFilesTestKt StructuredDataTestKt UtmLinksTestKt CsvSafeTestKt MoneyTestKt SignedCursorsTestKt IcsEventsTestKt IdsTestKt RetryBackoffTestKt TokenBucketTestKt SemverTestKt CronNextTestKt WcagContrastTestKt GeoTestKt WebhookSignatureTestKt CheckDigitsTestKt SignedUrlsTestKt PolylineTestKt TileMathTestKt EmailAddressTestKt IsoDurationTestKt GeometryTestKt SafeRedirectTestKt IpCidrTestKt HttpRangeTestKt ContentNegotiationTestKt HttpConditionalTestKt CookiesTestKt UrlNormalizeTestKt StringSimilarityTestKt RRuleTestKt BaseEncodingsTestKt VCardTestKt HashingTestKt FeatureFlagsTestKt HumanUnitsTestKt LineDiffTestKt PasswordPolicyTestKt TextSanitizeTestKt SlugifyTestKt JsonPatchTestKt SseTestKt TextChunkingTestKt VectorMathTestKt CircuitBreakerTestKt BusinessDaysTestKt NaturalSortTestKt FileSignatureTestKt ColorConvertTestKt; do java -cp "$out/kotlin-tests.jar" $t || exit 1; done
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@v1
      - run: cd examples/languages/dart && dart pub get && dart run test/all_test.dart
